experiment:
  name: mnist0_64_vqc
  seed: 0
  output_dir: outputs/qgan/mnist0_64_vqc

data:
  dataset: mnist
  root: datasets
  digits: [0]
  image_size: 8
  samples_per_class: 1000
  download: false
  encoding: probability_amplitude

model:
  generator: pqc
  generator_layers: 2
  discriminator: vqc
  input_dim: 64
  backend: chebyshev
  loss_mode: trace_z
  evolution_time: 1.0
  chebyshev_order: 128
  chebyshev_tol: 1.0e-10
  init_h: 0.02

training:
  epochs: 100
  batch_size: 16
  lr_g: 0.001
  lr_d: 0.001
  n_d_steps: 1
  grad_clip: 5.0
  leakage_penalty: 0.0
  checkpoint_every: 1

runtime:
  device: cuda
  complex_dtype: complex64
