experiment:
  name: mnist0_ae64_qsnn_full
  seed: 0
  output_dir: outputs/qgan/ae64_comparison/qsnn_full

data:
  dataset: mnist
  root: datasets
  digits: [0]
  image_size: 28
  samples_per_class: 1000
  download: false
  representation: autoencoder
  autoencoder_checkpoint: outputs/autoencoder/mnist0_ae64_balanced/checkpoint_best.pt
  autoencoder_batch_size: 256
  encoding: probability_amplitude

model:
  generator: pqc
  generator_layers: 4
  noise_dim: 12
  noise_reuploading: true
  alternating_entanglement: true
  canonicalize_output: true
  discriminator: qsnn
  input_dim: 64
  backend: cheby_suzuki
  loss_mode: trace_z
  coherent_time: 1.0
  dissipative_time: 1.0
  stage2_steps: 12
  chebyshev_order: 128
  chebyshev_tol: 1.0e-10
  suzuki_steps: 12
  suzuki_order: 2
  init_h: 0.02
  init_gamma: 0.1
  target_output_mass: 0.8
  gamma_semantics: amplitude
  ablation: full

training:
  epochs: 100
  batch_size: 16
  lr_g: 0.001
  lr_d: 0.001
  n_d_steps: 1
  n_g_steps: 3
  grad_clip: 5.0
  leakage_penalty: 0.1
  checkpoint_every: 1

runtime:
  device: cuda
  complex_dtype: complex64
